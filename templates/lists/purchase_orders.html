{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-end mb-2"><a href="/purchase-orders/new" class="btn">New Purchase Order</a></div>
<table class="table">
	<thead><tr><th>ID</th><th>Date</th><th>Supplier</th><th>Total Cost</th></tr></thead>
	<tbody>
		{% for o in pos %}
		<tr>
			<td>{{ o.id }}</td>
			<td>{{ o.order_date }}</td>
			<td>{{ o.supplier.name if o.supplier else '' }}</td>
			<td>{{ o.total_cost|currency }}</td>
		</tr>
		{% endfor %}
	</tbody>
</table>
{% endblock %}
