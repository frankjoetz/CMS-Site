{% extends 'base.html' %}
{% block content %}
<div class="grid">
	<div class="card">
		<div>Open Pendings</div>
		<div id="card-pendings" style="font-size:28px;font-weight:700;">0</div>
	</div>
	<div class="card">
		<div>Low Stock Items</div>
		<div id="card-low-stock" style="font-size:28px;font-weight:700;">0</div>
	</div>
	<div class="card">
		<div>Total Inventory Value</div>
		<div id="card-inventory-value" style="font-size:28px;font-weight:700;">$0.00</div>
	</div>
</div>
<div class="grid">
	<div class="card" style="height:320px;">
		<canvas id="chart-monthly-po"></canvas>
	</div>
	<div class="card" style="height:320px;">
		<canvas id="chart-daily-receipts"></canvas>
	</div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
