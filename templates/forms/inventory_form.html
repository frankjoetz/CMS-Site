{% extends 'base.html' %}
{% block content %}
<form method="post" class="card">
	<div class="row">
		<div>
			<label>Product</label>
			<select name="product_id" required>
				{% for p in products %}
				<option value="{{ p.id }}">{{ p.name }}</option>
				{% endfor %}
			</select>
		</div>
		<div>
			<label>Quantity on Hand</label>
			<input name="quantity_on_hand" type="number" value="0">
		</div>
		<div>
			<label>Reorder Level</label>
			<input name="reorder_level" type="number" value="0">
		</div>
	</div>
	<div class="mt-3">
		<button class="btn" type="submit">Save</button>
		<a href="/inventory" class="btn secondary">Cancel</a>
	</div>
</form>
{% endblock %}
